<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../frame.css"></head>
<body>
<div id="shot">
	<div class="titlebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="name">Echo Scribe — Settings</span></div>
	<div class="row">
		<div class="sidebar">
			<div class="item active">General</div><div class="item">Permissions</div><div class="item">Models</div><div class="item">Hotkeys</div><div class="item">Appearance</div>
		</div>
		<div class="body" style="flex:1">
			<div class="h" style="margin-bottom:14px">Permissions</div>
			<div class="card" style="display:flex;align-items:center;gap:10px"><span class="sub" style="flex:1">Microphone access</span><span style="color:var(--accent);font-weight:700">✓ Granted</span></div>
			<div class="card" style="display:flex;align-items:center;gap:10px"><span class="sub" style="flex:1">Screen recording</span><span style="color:var(--accent);font-weight:700">✓ Granted</span></div>
			<div class="card" style="display:flex;align-items:center;gap:10px"><span class="sub" style="flex:1">Accessibility</span><span style="color:var(--accent);font-weight:700">✓ Granted</span></div>
			<div class="card" style="display:flex;align-items:center;gap:10px"><span class="sub" style="flex:1">Transcription model</span><span style="font-weight:600;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px">On-device (fast) ▾</span></div>
			<div class="card" style="display:flex;align-items:center;gap:10px"><span class="sub" style="flex:1">Summary model</span><span style="font-weight:600;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px">On-device (balanced) ▾</span></div>
			<div class="card" style="display:flex;align-items:center;gap:10px">
				<span class="sub" style="flex:1">Theme</span>
				<span style="display:flex;gap:6px">
					<span style="padding:5px 10px;border-radius:7px;font-size:12px;border:1px solid var(--line)">Light</span>
					<span style="padding:5px 10px;border-radius:7px;font-size:12px;border:1px solid var(--line)">Dark</span>
					<span style="padding:5px 10px;border-radius:7px;font-size:12px;background:var(--accent);color:#fff;font-weight:600">Auto</span>
				</span>
			</div>
			<div class="card" style="display:flex;align-items:center;gap:10px"><span class="sub" style="flex:1">Push-to-talk hotkey</span><span style="font-family:monospace;font-size:13px;background:var(--panel);border-radius:6px;padding:5px 10px">⌃ Space</span></div>
		</div>
	</div>
</div>
</body></html>
