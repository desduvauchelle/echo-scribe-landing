<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../frame.css"></head>
<body>
<div id="shot">
	<div class="titlebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="name">Echo Scribe — Editor</span></div>
	<div class="body">
		<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
			<div class="h">Launch teaser cut</div>
			<span class="tag">Auto-zoom on</span>
		</div>
		<div class="card" style="background:var(--ink);min-height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:14px">
			<div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center">
				<div style="width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:16px solid #fff;margin-left:4px"></div>
			</div>
		</div>
		<div class="card" style="padding:14px">
			<div class="sub" style="margin-bottom:8px">Timeline</div>
			<div style="position:relative;height:36px;border-radius:8px;background:var(--panel);overflow:hidden">
				<div style="position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--accent-soft)"></div>
				<span style="position:absolute;left:12%;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)"></span>
				<span style="position:absolute;left:29%;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)"></span>
				<span style="position:absolute;left:61%;top:6px;width:8px;height:8px;border-radius:50%;background:var(--muted)"></span>
				<span style="position:absolute;left:38%;top:0;bottom:0;width:2px;background:var(--ink)"></span>
			</div>
			<div style="display:flex;justify-content:space-between;margin-top:6px" class="sub"><span>0:00</span><span>0:42 / 1:52</span></div>
		</div>
		<div class="row" style="margin-top:12px">
			<div class="card" style="flex:1;margin-bottom:0;display:flex;align-items:center;gap:10px">
				<span class="sub">Background</span>
				<span style="width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#1f7a54,#123b2d);border:1px solid var(--line)"></span>
				<span style="width:20px;height:20px;border-radius:6px;background:#f6f8f7;border:1px solid var(--line)"></span>
				<span style="width:20px;height:20px;border-radius:6px;background:#14231d;border:1px solid var(--line)"></span>
			</div>
		</div>
	</div>
</div>
</body></html>
