<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../frame.css"></head>
<body>
<div id="shot">
	<div class="titlebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="name">Echo Scribe — Screen Recorder</span></div>
	<div class="body">
		<div class="h" style="margin-bottom:14px">New recording</div>
		<div style="display:flex;gap:10px;margin-bottom:16px">
			<div class="tag" style="background:var(--accent);color:#fff;padding:6px 14px;font-size:12px">Window</div>
			<div class="tag" style="padding:6px 14px;font-size:12px">Full screen</div>
			<div class="tag" style="padding:6px 14px;font-size:12px">Area</div>
		</div>
		<div class="row">
			<div class="card" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:160px;background:var(--panel)">
				<div style="text-align:center">
					<div style="font-size:44px;font-weight:800;color:var(--accent);letter-spacing:-0.02em">3</div>
					<div class="sub">Recording starts in…</div>
				</div>
			</div>
			<div style="width:150px;display:flex;flex-direction:column;gap:10px">
				<div class="card" style="padding:10px;text-align:center">
					<div style="width:100%;height:70px;border-radius:8px;background:linear-gradient(135deg,var(--accent-soft),var(--panel));display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:11px;font-weight:700">CAMERA</div>
					<div class="sub" style="margin-top:6px">Picture-in-picture</div>
				</div>
				<div style="display:flex;align-items:center;gap:8px;justify-content:center;background:#ff5f57;color:#fff;border-radius:999px;padding:10px 0;font-weight:700;font-size:13px">
					<span style="width:10px;height:10px;border-radius:50%;background:#fff"></span> Record
				</div>
			</div>
		</div>
	</div>
</div>
</body></html>
